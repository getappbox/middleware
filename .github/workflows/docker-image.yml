name: Test and Build Middleware

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: go.sum
      - name: Verify modules
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Unit and compatibility tests
        run: go test -race -count=1 ./...

  build-and-push:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine image tags
        id: meta
        shell: bash
        run: |
          REPO="ghcr.io/${{ github.repository }}"
          {
            echo 'tags<<EOF'
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "$REPO:${GITHUB_REF#refs/tags/}"
            else
              echo "$REPO:$(date -u +'%Y%m%d-%H%M%S')"
              echo "$REPO:${GITHUB_SHA::7}"
            fi
            echo "$REPO:latest"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Build image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: middleware:test
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container smoke tests
        run: ./Scripts/test.sh e2e --no-build
        env:
          E2E_SKIP_ONLINE: '1'
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
          provenance: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
